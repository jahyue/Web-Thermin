<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Theremin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="https://img.dafont.com/preview.php?text=Web+Theremin&ttf=sf_theramin_gothic3&ext=1&size=46&psize=l&y=56" alt="Web Theremin Logo" style="width: 500px; height: auto; transform: translateX(10%);">
    <canvas id="thereminCanvas" width="800" height="400"></canvas>
    <div id="container">
    <div id="noteDisplay" style="width: 200px; height: 20px;">
        Note: <span id="note">None</span>
    </div>
    <div id="frequencyDisplay" style="width: 200px; height: 20px;">
        Frequency: <span id="frequencyText">None</span>
    </div>
    <div id="volumeDisplay" style="width: 200px; height: 20px;">
        Volume: <span id="volumeText">None</span>
    </div>
    <div id="controls">
    <label for="waveformSelect">Waveform:</label>
    <select id="waveformSelect">
        <option value="sine">Sine</option>
        <option value="square">Square</option>
        <option value="sawtooth">Sawtooth</option>
        <option value="triangle">Triangle</option>
    </select>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
