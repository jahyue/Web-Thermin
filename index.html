<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Thermin</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Web Thermin</h1>
    <canvas id="thereminCanvas" width="800" height="400"></canvas>
    <label for="waveformSelect">Waveform:</label>
    <select id="waveformSelect">
        <option value="sine">Sine</option>
        <option value="square">Square</option>
        <option value="sawtooth">Sawtooth</option>
        <option value="triangle">Triangle</option>
    </select>
    <div id="notetext" style="width: 200px; height: 100px;">
        Note: <span id="noteDisplay">None</span>
    </div>
    <div id="frequency" style="width: 200px; height: 100px;">
        Frequency: <span id="frequencyDisplay">None</span>
    </div>
    <script src="script.js"></script>
</body>
</html>
